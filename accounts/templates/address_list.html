<h2>My Addresses</h2>

<a href="{% url 'add-address' %}">Add Address</a>

{% for address in addresses %}
  <div>
    <p>
      {{ address.full_name }},
      {{ address.address_line_1 }},
      {{ address.city }}
    </p>

    {% if address.is_default %}
      <strong>Default</strong>
    {% endif %}

    <a href="{% url 'edit-address' address.id %}">Edit</a>
    <a href="{% url 'delete-address' address.id %}">Delete</a>
  </div>
{% empty %}
  <p>No addresses added yet.</p>
{% endfor %}
