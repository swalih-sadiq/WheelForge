{% extends "base_auth.html" %}

{% block title %}Reset Password - WheelForge{% endblock %}

{% block content %}
<div class="flex min-h-screen items-center justify-center">
    <div class="w-full max-w-md bg-white p-8 rounded-lg shadow">
        
        <h2 class="text-2xl font-bold mb-6 text-center">Reset Your Password</h2>

        {% if messages %}
        <div class="mb-4">
            {% for message in messages %}
                <div class="p-3 rounded 
                    {% if message.tags == 'error' %}bg-red-100 text-red-700
                    {% elif message.tags == 'success' %}bg-green-100 text-green-700
                    {% else %}bg-blue-100 text-blue-700{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block mb-1 font-medium">New Password</label>
                <input type="password" name="password" required
                       class="w-full border px-3 py-2 rounded">
            </div>

            <div>
                <label class="block mb-1 font-medium">Confirm Password</label>
                <input type="password" name="confirm_password" required
                       class="w-full border px-3 py-2 rounded">
            </div>

            <button type="submit"
                class="w-full bg-gray-900 text-white py-2 rounded hover:bg-gray-800">
                Reset Password
            </button>
        </form>

    </div>
</div>
{% endblock %}
