<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

<h2>Login</h2>

{% for message in messages %}
    <p>{{ message }}</p>
{% endfor %}

<!-- NORMAL LOGIN FORM  -->
<form method="post">
    {% csrf_token %}
    <input type="email" name="email" placeholder="Email" required><br><br>
    <input type="password" name="password" placeholder="Password" required><br><br>
    <button type="submit">Login</button>
</form>

<!-- SOCIAL LOGIN  -->
<hr>
<p>Or login using:</p>

<a href="/accounts/google/login/">Login with Google</a>
<br>
<a href="/accounts/facebook/login/">Login with Facebook</a>

<!-- LINKS  -->
<hr>

<a href="{% url 'forgot_password' %}">Forgot password?</a><br>
<a href="{% url 'signup' %}">Don’t have an account?</a>

</body>
</html>
