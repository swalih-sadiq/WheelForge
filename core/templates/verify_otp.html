<h2>Verify OTP</h2>
<form method="post">
  {% csrf_token %}
  <input type="text" name="otp" placeholder="Enter OTP" required><br>
  <button type="submit">Verify</button>
</form>

{% for message in messages %}
<p>{{ message }}</p>
{% endfor %}

<hr>

<p>Didn’t receive the OTP?</p>

<a href="{% url 'resend_otp' %}">
  <button type="button">Resend OTP</button>
</a>
